name: 도커이미지생성 Workflow

on:
  workflow_dispatch:

jobs:

  stable:
    name: Build Stable and Nightly Docker if Release
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: NodeJS to Compile WebUI
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |

          cd UI/Web || exit
          echo 'Installing web dependencies'
          npm ci

          echo 'Building UI'
          npm run prod

          echo 'Copying back to Kavita wwwroot'
          rsync -a dist/ ../../API/wwwroot/

          cd ../ || exit

      - name: Compile dotnet app
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install Swashbuckle CLI
        run: dotnet tool install -g Swashbuckle.AspNetCore.Cli

      - run: ./monorepo-build.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push stable
        id: docker_build_stable
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: kavita:latest

      - name: Save Docker image to tar
        run: docker save -o kavita-image.tar kavita:latest
      
      - name: Upload Docker Image as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kavita-docker-image
          path: kavita-image.tar
